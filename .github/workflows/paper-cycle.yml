name: Run paper-trading cycle

on:
  workflow_dispatch:
  schedule:
    # Recovery checks avoid top-of-hour congestion; trading remains limited to one cycle every four hours.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: paper-trading-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic paper cycle when due
        run: python scripts/run_paper_cycle.py
      - name: Save virtual account state
        run: |
          git config user.name "trading-lab-bot"
          git config user.email "trading-lab-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "paper cycle $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
