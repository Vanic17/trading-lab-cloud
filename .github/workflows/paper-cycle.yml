name: Run paper-trading cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic paper cycle
        run: python scripts/run_paper_cycle.py
      - name: Save virtual account state
        run: |
          git config user.name "trading-lab-bot"
          git config user.email "trading-lab-bot@users.noreply.github.com"
          git add data/state.json data/latest_report.json
          git diff --cached --quiet || git commit -m "paper cycle $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
