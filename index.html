<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Lab · Paper</title><style>body{margin:0;background:#0b1020;color:#eef2ff;font:16px system-ui;padding:32px}main{max-width:960px;margin:auto}.card{background:#151c33;border:1px solid #273253;border-radius:14px;padding:20px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#10172a;padding:16px;border-radius:10px}.muted{color:#9eacca}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #273253;text-align:left}@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}body{padding:16px}}</style></head><body><main><h1>Trading Lab <span class="muted">· Paper only</span></h1><p id="updated" class="muted">Caricamento stato…</p><section class="metrics"><div class="metric">Equity<strong id="equity"></strong></div><div class="metric">P&amp;L<strong id="pnl"></strong></div><div class="metric">Liquidità<strong id="cash"></strong></div><div class="metric">Coppie valide<strong id="coverage"></strong></div></section><section class="card"><h2>Posizioni aperte</h2><div id="positions" class="muted">Nessuna posizione</div></section><section class="card"><h2>Ultime azioni</h2><div id="actions" class="muted">Nessuna azione ancora registrata</div></section><p class="muted">Simulazione automatica su dati pubblici Kraken. Non collega exchange né invia ordini reali.</p></main><script>const eur=x=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(x);fetch('data/latest_report.json?'+Date.now()).then(r=>r.json()).then(d=>{updated.textContent=`Aggiornato: ${new Date(d.generatedAt).toLocaleString('it-IT')} · ${d.experiment}`;equity.textContent=eur(d.equity);pnl.textContent=eur(d.pnl);cash.textContent=eur(d.cash);coverage.textContent=`${d.coverage.eligible}/${d.coverage.configured}`;let p=Object.entries(d.openPositions);positions.innerHTML=p.length?`<table><tr><th>Asset</th><th>Prezzo entrata</th><th>Unità</th></tr>${p.map(([s,x])=>`<tr><td>${s}</td><td>${eur(x.entryPrice)}</td><td>${x.units.toFixed(6)}</td></tr>`).join('')}</table>`:'Nessuna posizione';actions.innerHTML=d.actions.length?`<table><tr><th>Azione</th><th>Asset</th><th>Motivo</th></tr>${d.actions.map(x=>`<tr><td>${x.side}</td><td>${x.symbol}</td><td>${x.reason}</td></tr>`).join('')}</table>`:'Nessuna azione in quest’ultimo ciclo';}).catch(()=>{updated.textContent='Il primo ciclo non è ancora stato eseguito. Apri Actions e avvialo una volta.'})</script></body></html>
